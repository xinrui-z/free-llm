name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'catalog/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      catalog_base:
        description: 'Previous commit for changes produced by catalog sync'
        type: string
        required: false
permissions:
  contents: read
# Deploys are serialized. GitHub keeps only the newest pending run in a group, so a queued
# catalog dispatch can be superseded; the changelog base below therefore comes from the last
# run whose sync succeeded, not from the triggering event, and no catalog change is skipped.
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run check
        env:
          # Expired promotional prices fail PR validation but only warn on deploy.
          CATALOG_ALLOW_EXPIRED: '1'
          PUBLIC_STATUS_WORKER_URL: ${{ secrets.PUBLIC_STATUS_WORKER_URL }}
          CATALOG_MODE: ${{ vars.CATALOG_MODE }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
      - run: npm run test:dynamic
        working-directory: site
      # Local Wrangler secrets must never reach the deployed bundle.
      - run: find site/dist -name '.dev.vars*' -print -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/dist
          # The Cloudflare adapter writes dist/client/.assetsignore, which keeps server files out of public assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  sync-providers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Sync catalog and curated changelog
        if: env.WORKER_URL != '' && vars.CATALOG_MODE != 'dynamic'
        run: |
          test -n "$REFRESH_SECRET" || { echo 'REFRESH_SECRET must be configured'; exit 1; }
          node scripts/validate.mjs --allow-expired
          node scripts/build-providers-bundle.mjs --out "$RUNNER_TEMP/providers.bundle.json"
          curl --fail-with-body --max-time 60 -X PUT "$WORKER_URL/api/providers" -H 'Content-Type: application/json' -H "X-Refresh-Secret: $REFRESH_SECRET" --data @"$RUNNER_TEMP/providers.bundle.json"
          curl --fail-with-body --max-time 60 -X POST "$WORKER_URL/api/changelog/replace" -H 'Content-Type: application/json' -H "X-Refresh-Secret: $REFRESH_SECRET" --data @site/src/data/changelog.json
      # Dynamic mode: the catalog lives in D1, but hand-written changelog.json entries still come from git.
      # The checker stores them as permanent 'curated' D1 events (no KV TTL).
      - name: Sync curated changelog (dynamic)
        if: env.WORKER_URL != '' && vars.CATALOG_MODE == 'dynamic'
        run: |
          test -n "$REFRESH_SECRET" || { echo 'REFRESH_SECRET must be configured'; exit 1; }
          node scripts/validate.mjs --allow-expired
          curl --fail-with-body --max-time 60 -X POST "$WORKER_URL/api/changelog/replace" -H 'Content-Type: application/json' -H "X-Refresh-Secret: $REFRESH_SECRET" --data @site/src/data/changelog.json
      - name: Choose the changelog base
        id: changelog-base
        if: env.WORKER_URL != '' && vars.CATALOG_MODE != 'dynamic'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BASE: ${{ github.event.before || inputs.catalog_base }}
        run: |
          # Prefer the head of the newest earlier run that actually appended catalog changes: superseded
          # pending runs never execute, so their event bases would otherwise drop catalog changes. A
          # successful sync-providers job is not enough, because dynamic-mode, unconfigured or no-base
          # runs skip the append step and still succeed.
          base=''
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status completed --limit 30 --json databaseId --jq '.[].databaseId' || true)
          for id in $runs; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            sha=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq 'select(any(.jobs[]; .name == "sync-providers" and any(.steps[]?; .name == "Append catalog changes across the entire update" and .conclusion == "success"))) | .headSha' || true)
            if [ -n "$sha" ]; then
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$sha" HEAD; then base=$sha; fi
              break
            fi
          done
          if [ -z "$base" ] && [[ "$EVENT_BASE" =~ ^[0-9a-f]{40}$ ]] && { [[ "$EVENT_BASE" =~ ^0+$ ]] || git merge-base --is-ancestor "$EVENT_BASE" HEAD; }; then
            base=$EVENT_BASE
          fi
          if [ -z "$base" ]; then
            echo '::warning::No synced ancestor or valid event base; catalog changelog entries were not generated for this run.'
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Append catalog changes across the entire update
        if: steps.changelog-base.outputs.sha != ''
        env:
          BASE_REV: ${{ steps.changelog-base.outputs.sha }}
        run: node scripts/gen-changelog.mjs --base "$BASE_REV"
      - name: Refresh probes
        if: env.WORKER_URL != '' && vars.CATALOG_MODE != 'dynamic' && inputs.catalog_base == ''
        run: |
          curl --fail-with-body --max-time 90 "$WORKER_URL/api/refresh" -H "X-Refresh-Secret: $REFRESH_SECRET" -o /dev/null
  deploy-site:
    needs: sync-providers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require a live D1 catalog before switching to the dynamic site
        if: vars.CATALOG_MODE == 'dynamic'
        env:
          # The checker's public URL. The deployed site reads the same Worker through its CHECKER service binding,
          # and browsers call this URL for /api/status and /api/changelog.
          CATALOG_URL: ${{ secrets.PUBLIC_STATUS_WORKER_URL }}
        run: |
          test -n "$CATALOG_URL" || { echo '::error::PUBLIC_STATUS_WORKER_URL must be configured in dynamic mode'; exit 1; }
          code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/catalog.json" -w '%{http_code}' "${CATALOG_URL%/}/api/catalog") || code=000
          [ "$code" = 200 ] || { echo "::error::Catalog API returned HTTP $code"; exit 1; }
          revision=$(jq -er 'select((.providers | type) == "array" and (.providers | length) > 0) | .revision | strings | select(length > 0)' "$RUNNER_TEMP/catalog.json") \
            || { echo '::error::Catalog API response has no revision or providers'; exit 1; }
          # "legacy" means the checker has no D1 binding, so dynamic routes would not be backed by D1.
          [ "$revision" != legacy ] || { echo '::error::Checker is serving the legacy KV catalog; bind and bootstrap D1 first'; exit 1; }
          echo "Catalog revision: $revision"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site/dist
      # Static mode deploys to the free-llm-apis Pages project. After the dynamic cutover that project serves
      # only redirect/ (deployed by hand), so a static deploy here would replace the redirect.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        if: vars.CATALOG_MODE != 'dynamic'
        with:
          wranglerVersion: '4.163.0' # keep in sync with site/package-lock.json
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=free-llm-apis
          workingDirectory: site
      # The generated config carries site/wrangler.jsonc, including the CHECKER service binding the site Worker
      # uses to read the catalog (workers.dev Workers on one account cannot fetch each other over HTTP).
      - name: Require the CHECKER service binding in the generated Worker config
        if: vars.CATALOG_MODE == 'dynamic'
        working-directory: site
        run: |
          jq -e '.name == "free-llm-site" and any(.services[]?; .binding == "CHECKER" and .service == "free-llm-checker")' dist/server/wrangler.json > /dev/null \
            || { echo '::error::dist/server/wrangler.json has no CHECKER service binding to free-llm-checker'; exit 1; }
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        if: vars.CATALOG_MODE == 'dynamic'
        with:
          wranglerVersion: '4.163.0' # keep in sync with site/package-lock.json
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          workingDirectory: site
# The checker Worker is deployed separately; this workflow only syncs its public catalog.
