name: Price drift report
# Compares catalogued per-token prices with the official pricing pages of providers that have no price API
# (see scripts/catalog/price-pages.mjs), lists priced models the catalog does not have yet, and keeps one open issue
# up to date while anything needs review. It never changes the catalog: a maintainer applies or ignores each item
# (dynamic mode: in the review console).
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: price-drift
  cancel-in-progress: false
jobs:
  # Node built-ins only and no dependency install, like the catalog sync's collect job.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      attention: ${{ steps.check.outputs.attention }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Compare prices with official pricing pages
        id: check
        env:
          # Dynamic mode: compare with the live catalog; static mode: with the provider JSON in main.
          CATALOG_MODE: ${{ vars.CATALOG_MODE }}
          CATALOG_URL: ${{ secrets.PUBLIC_STATUS_WORKER_URL }}
        run: |
          set +e
          if [ "$CATALOG_MODE" = dynamic ]; then
            # The repository JSON is not the live catalog in dynamic mode, so never fall back to it.
            [ -n "$CATALOG_URL" ] || { echo '::error::PUBLIC_STATUS_WORKER_URL must be configured in dynamic mode'; exit 2; }
            node scripts/check-prices.mjs --catalog-url "$CATALOG_URL"
          else
            node scripts/check-prices.mjs
          fi
          code=$?
          set -e
          [ "$code" -le 1 ] || exit "$code"
          echo "attention=$([ "$code" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat .catalog-reports/prices/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: price-drift-report
          path: .catalog-reports/prices/
          include-hidden-files: true
          retention-days: 14
  # Holds the only write permission (issues) and never runs repository code.
  report:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: price-drift-report
          path: ${{ runner.temp }}/report
      - name: Open, update or close the price drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ATTENTION: ${{ needs.check.outputs.attention }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ runner.temp }}/report/report.md
        run: |
          title='Price check: catalog prices and new models to review'
          # Only the issue this workflow opened counts: anyone can open an issue with the same title.
          number=$(gh issue list --state open --author app/github-actions --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$ATTENTION" = true ]; then
            { cat "$REPORT"; echo; echo "Run: $RUN_URL"; echo; echo '_Updated automatically by the Price drift report workflow. It closes this issue once every tracked price matches and no new model is waiting for review._'; } > "$RUNNER_TEMP/body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All tracked prices match the official pricing pages and no new model is waiting for review ($RUN_URL)."
          fi
